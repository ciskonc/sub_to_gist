# sub_to_gist 云端同步 v2 —— 上游合并后单文件推送（不依赖转换服务多源合并）
# 前置 Secrets: GIST_TOKEN / TASK_SUB_URL / TASK_SUB2_URL
name: sync-sub
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'   # UTC 22:30 = 北京时间 06:30

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch sources and merge
        env:
          S1: ${{ secrets.TASK_SUB_URL }}
          S2: ${{ secrets.TASK_SUB2_URL }}
        run: |
          set -e
          # UA=PassWall2: 源站返回 base64/URI 列表（clash UA 会返回 YAML，合并管线不适用）
          curl -sS --max-time 60  -A 'PassWall2' "$S1" -o s1.raw
          curl -sS --max-time 60  -A 'PassWall2' "$S2" -o s2.raw
          for f in s1 s2; do
            if head -c 4 $f.raw | grep -q 'http'; then
              cp $f.raw $f.txt
            elif base64 -d -i $f.raw > $f.txt 2>/dev/null && grep -q '://' $f.txt; then
              : # base64 decoded
            else
              cp $f.raw $f.txt
            fi
            echo "$f: $(grep -c '://' $f.txt || true) endpoints, $(wc -c < $f.txt) bytes"
          done
          cat s1.txt s2.txt > merged.txt
          echo "merged total: $(grep -c '://' merged.txt || true) endpoints"

      - name: Push merged content to gist sub.txt
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          jq -n --rawfile m merged.txt --arg g "$GIST_ID" '{files:{"sub.txt":{content:$m}}}' > payload.json
          HTTP=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json \
            "https://api.github.com/gists/$g")
          echo "gist PATCH HTTP=$HTTP"
          [ "$HTTP" = "200" ]

      - name: Verify gist freshness
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          sleep 2
          curl -sS -H "Authorization: Bearer $GIST_TOKEN" \
            "https://api.github.com/gists/$GIST_ID" \
            | grep -E '"description"|"updated_at"'
